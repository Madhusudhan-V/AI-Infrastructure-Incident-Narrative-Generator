name: Sentinel validation

on:
  push:
  pull_request:

concurrency:
  group: sentinel-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run final validation pipeline
        run: python -m src.evaluation.final_validation --output-dir /tmp/sentinel-final-validation
